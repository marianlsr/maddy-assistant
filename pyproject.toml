[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maddy-core-portfolio"
version = "0.1.0"
description = "A curated, offline technical demonstration extracted from the Maddy personal assistant"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
